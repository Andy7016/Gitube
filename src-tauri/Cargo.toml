[package]
name = "gitube"
version = "0.2.0"
description = "Gitube：像刷 B 站 / YouTube 一样刷 GitHub 开源项目"
authors = ["Andy7016"]
license = "MIT"
repository = "https://github.com/Andy7016/Gitube"
edition = "2021"
rust-version = "1.77.2"

[lib]
# 名字和包名不同，避免 Windows 上 cargo 的一个已知问题
name = "gitube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 让 target="_blank" 的链接用系统默认浏览器打开
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 设备码登录时代发 GitHub 登录请求（网页不能跨域调用这两个接口）。
# native-tls 用系统自带的证书和加密库；system-proxy 让请求走系统代理设置
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "form", "system-proxy"] }
