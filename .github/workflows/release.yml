# 发布桌面软件：在 GitHub 上打包 Mac / Windows / Linux 安装包，并放到 Releases 页面
# 用法：仓库 Actions → 发布桌面软件 → Run workflow（或者推送一个 v 开头的标签，比如 v0.1.0）
# 版本号取自 src-tauri/tauri.conf.json 里的 "version"，发新版前先把它改大
name: 发布桌面软件

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple 芯片的 Mac
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel 芯片的 Mac
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 打包需要的系统库
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      - name: 打包并上传到 Releases
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Gitube v__VERSION__
          releaseBody: |
            下载对应系统的安装包：

            - **Mac（Apple 芯片：M1/M2/M3/M4…）**：`Gitube_*_aarch64.dmg`
            - **Mac（Intel 芯片）**：`Gitube_*_x64.dmg`
            - **Windows**：`Gitube_*_x64-setup.exe`
            - **Linux**：`.AppImage` 或 `.deb`

            这个软件没有经过苹果 / 微软的付费签名，第一次打开会被系统拦一下：
            - **Mac**：如果提示“无法验证开发者”或“已损坏”，打开「系统设置 → 隐私与安全性」，在下方点「仍要打开」；或者在终端运行 `xattr -cr /Applications/Gitube.app` 后再打开。
            - **Windows**：如果出现“Windows 已保护你的电脑”，点「更多信息 → 仍要运行」。

            不想安装的话，也可以直接用网页版：https://andy7016.github.io/Gitube/
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
